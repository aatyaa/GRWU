[project]
name = "grwu-pipeline"
version = "0.1.0"
description = "Prepares gravitational-wave data and reference outputs for the GRWU site."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "emcee>=3.1.6",
    "gwosc>=0.8",
    "h5py>=3.10",
    "numpy>=2.0",
    "qnm>=0.4",
    "scipy>=1.13",
]

[project.scripts]
grwu-pipeline = "grwu_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # qnm unpickles a table that names scipy.optimize.optimize; harmless until SciPy 2.
    "ignore:Please import `OptimizeResult`:DeprecationWarning",
]
